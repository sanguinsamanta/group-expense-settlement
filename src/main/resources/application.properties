# ==============================================================================
# Group Expense Settlement System - Application Configuration
# ==============================================================================

# Application & Server Configuration
spring.application.name=group-expense-settlement
server.port=${PORT:8080}

# PostgreSQL Database Configuration (overridable via environment variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:group_expense_settlement}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON serialization settings
spring.jackson.deserialization.fail-on-unknown-properties=false
